name:                exchangealgebra-aeson
version:             0.6.0.0
github:              "yakagika/ExchangeAlgebra"
license:             OtherLicense
author:              "Kaya Akagi"
maintainer:          "yakagika@icloud.com"
copyright:           "2026 Kaya Akagi"

extra-source-files:
- README.md
- ChangeLog.md

synopsis:            JSON decoders for the ExchangeAlgebra admission inputs
category:            Accounting, Finance, JSON

description:         Please see the README on GitHub at <https://github.com/yakagika/ExchangeAlgebra/tree/master/exchangealgebra-aeson#readme>

# The core bound is widened while develop still carries 0.5.3.1; the release
# commit fixes it to the same version as the core (== 0.6.0.0).
dependencies:
- base                  >= 4.17    && < 5
- exchangealgebra       >= 0.5.3.1 && < 0.7
- aeson                 >= 2.2     && < 2.3
- scientific            >= 0.3.7   && < 0.4
- text                  >= 2.0     && < 2.2
- bytestring            >= 0.11    && < 0.13
- containers            >= 0.6     && < 0.8

library:
  source-dirs: src
  exposed-modules:
  - ExchangeAlgebra.Aeson.Admission
  ghc-options:
  - -Wall
