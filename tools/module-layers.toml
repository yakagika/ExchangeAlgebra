# Prefixes are relative to ExchangeAlgebra. The longest matching prefix wins.
layers = ["Algebra", "Journal", "Accounting", "IO", "Simulation"]
umbrella = ["ExchangeAlgebra"]
shims = ["Algebra.Readout.Net", "Posting"] # Add the 0.6 compatibility modules as they are created.

[assign]
Algebra = "Algebra"
"Algebra.Internal" = "Algebra"
"Algebra.Core" = "Algebra"
"Algebra.Posting" = "Algebra"
"Algebra.Base" = "Algebra"
"Algebra.Base.Element" = "Algebra"
"Algebra.Base.Account.JcciAliases" = "Algebra"
"Algebra.Base.Account.Registry" = "Algebra"
"Algebra.Base.Account.Types" = "Algebra"
"Algebra.Exact" = "Algebra"
"Algebra.Readout.Net" = "Algebra"
Value = "Algebra"
Posting = "Algebra"
Foundation = "Algebra"
"Algebra.Base.Account" = "Accounting"
"Algebra.Transfer" = "Accounting"
"Algebra.Transfer.Rule" = "Accounting"
"Algebra.Transfer.Closing" = "Accounting"
Accounting = "Accounting"
"Accounting.Exchange" = "Accounting"
Bookkeeping = "Accounting"
TrialBalance = "Accounting"
Reporting = "Accounting"
Consolidation = "Accounting"
Journal = "Journal"
"Journal.Core" = "Journal"
"Journal.Core.Representation" = "Journal"
Convert = "IO"
Assist = "IO"
"Render.Csv" = "IO"
"Render.Bookkeeping" = "IO"
Write = "IO"
IO = "IO"
Simulate = "Simulation"
Optimize = "Simulation"
"Render.Simulation" = "Simulation"
Simulation = "Simulation"

[[intra]]
from = "Simulation.Engine"
to = "Simulation.Output"

[[intra]]
from = "Simulation.Engine"
to = "Simulation.Visualize"

[[intra]]
from = "Simulation.Network"
to = "Simulation.Network.Csv"

[[intra]]
from = "Simulation.Network"
to = "Simulation.Network.Journal"

# These orphans are outside the import graph. Remove them when the dependency
# supplies the instances or the axes become newtypes.
[[notes]]
item = "Hashable Day, Hashable TimeOfDay in Algebra.Base.Element"
reason = "Existing orphan instances; remove when upstream supplies them or axes use newtypes."
remove_by = "upstream instance or newtype migration"

[[exceptions]]
from = "Algebra.Base"
to = "Accounting.Account"
reason = "Legacy Base re-exports account entities during P2."
remove_by = "P4"

[[exceptions]]
from = "Algebra.Base"
to = "Accounting.Exchange"
reason = "Legacy Base re-exports accounting exchange entities during P2."
remove_by = "P4"

[[exceptions]]
from = "Algebra.Internal"
to = "Accounting.Exchange"
reason = "Legacy Internal re-exports accounting exchange entities during P2."
remove_by = "P4"

[[exceptions]]
from = "Algebra"
to = "Accounting.Exchange"
reason = "Legacy Algebra re-exports accounting exchange entities during P2."
remove_by = "P4"

[[exceptions]]
from = "Journal"
to = "Accounting.Exchange"
reason = "Legacy Journal re-exports accounting exchange entities during P2."
remove_by = "P4"

[[exceptions]]
from = "Algebra.Base.Element"
to = "Accounting.Account"
reason = "Legacy element path re-exports AccountTitles during 0.6."
remove_by = "0.7.0.0"

[[exceptions]]
from = "Algebra.Base.Account.JcciAliases"
to = "Accounting.Account.Aliases"
reason = "Legacy account alias namespace re-exports the new owner."
remove_by = "0.7.0.0"

[[exceptions]]
from = "Algebra.Base.Account.Registry"
to = "Accounting.Account.Registry"
reason = "Legacy account registry namespace re-exports the new owner."
remove_by = "0.7.0.0"

[[exceptions]]
from = "Algebra.Base.Account.Types"
to = "Accounting.Account.Classification"
reason = "Legacy account types namespace re-exports the new owner."
remove_by = "0.7.0.0"

[[exceptions]]
from = "Algebra.Exact"
to = "TrialBalance.Balance"
reason = "Exact accounting readout still uses the trial-balance account representation."
remove_by = "0.6.0.0"

[[exceptions]]
from = "Algebra.Readout.Net"
to = "Journal"
reason = "Legacy readout shim re-exports journal net readouts."
remove_by = "0.6.0.0"

[[exceptions]]
from = "Journal.Exact"
to = "TrialBalance.Balance"
reason = "Exact journal readout still exposes the account-balance representation."
remove_by = "0.6.0.0"

[[exceptions]]
from = "Journal.Transfer"
to = "Algebra.Transfer"
reason = "Legacy journal transfer delegates to the accounting transfer API."
remove_by = "0.6.0.0"

[[exceptions]]
from = "Journal.Transfer.Rule"
to = "Algebra.Transfer.Rule"
reason = "Legacy journal rule adapter delegates to accounting transfer rules."
remove_by = "0.6.0.0"

[[exceptions]]
from = "Write"
to = "Simulate.Spill"
reason = "Legacy output writer depends on simulation spill records."
remove_by = "0.6.0.0"
