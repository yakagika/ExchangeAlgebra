name: Manual Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook 0.5.4
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          curl --fail --location --silent --show-error \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies
        id: cargo-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook-gettext
            ~/.cargo/bin/mdbook-xgettext
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-mdbook-i18n-helpers-0.4.0

      - name: Install mdbook-i18n-helpers 0.4.0
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != 'true' || ! -x "$HOME/.cargo/bin/mdbook-gettext" || ! -x "$HOME/.cargo/bin/mdbook-xgettext" ]]; then
            cargo install mdbook-i18n-helpers --locked --version 0.4.0
          fi

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Build manual
        run: bash site/build.sh

      - name: Prepare public files
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R site/book/en site/book/ja site/book/index.html "$RUNNER_TEMP/pages/"

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: false

      - name: Upload public files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
