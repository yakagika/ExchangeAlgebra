name: CI

# Build + run the test and doctest suites, and build (not run) the benchmark
# harness so it cannot bitrot. This is the regression gate; a numeric criterion
# perf-regression gate is a future enhancement (see plans ROAD_MAP).

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The library depends on Chart-cairo (ExchangeAlgebra.Simulate.Visualize),
      # whose cairo/pango bindings need these system libraries.
      - name: Install system deps (cairo / pango for Chart-cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev libglib2.0-dev

      # Provide GHC 9.10.2 (matches resolver lts-24.4) via ghcup, plus stack.
      # We then run stack with --system-ghc so it uses this GHC instead of
      # downloading its own bindist (whose configure step fails on the runner
      # toolchain: gcc rejects --target=x86_64-unknown-linux).
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          ghc-version: '9.10.2'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
            examples/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml', 'examples/package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      # Builds the library, examples and the bench harness; runs the unit test
      # suite (incl. the QuickCheck axiom properties) and the doctests. The
      # benchmark is built but not run (--no-run-benchmarks) to keep CI fast.
      - name: Build + test + doctest (bench build-only)
        run: stack build --system-ghc --no-install-ghc --test --bench --no-run-benchmarks

  # Optional formal-verification job: LiquidHaskell refinement checks for the
  # value non-negativity invariant (0 <= magnitude; sign lives in the Hat/Not
  # base). Fully decoupled from build-test and from the main library build — it
  # builds ONLY the standalone harness under formal/liquid/ (its own stack
  # project, resolver lts-24.45 / GHC 9.10.3, which bundles liquidhaskell). The
  # LiquidHaskell plugin discharges the refinements during compilation via z3;
  # a regression here means an EA value invariant stopped being statically
  # provable (e.g. a raw subtraction that can go negative slipped in).
  liquid-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LiquidHaskell discharges refinement constraints with an SMT solver.
      - name: Install z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      # GHC 9.10.3 matches the harness resolver lts-24.45 (the snapshot that
      # ships liquidhaskell-0.9.10.1.2 / liquid-fixpoint-0.9.6.3.2).
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          ghc-version: '9.10.3'

      - name: Cache Stack (liquid harness)
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            formal/liquid/.stack-work
          key: ${{ runner.os }}-stack-liquid-${{ hashFiles('formal/liquid/stack.yaml', 'formal/liquid/package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-liquid-

      # The LiquidHaskell plugin runs during compilation; a non-negativity
      # violation fails the build (**** LIQUID: UNSAFE ****).
      - name: LiquidHaskell verify (formal/liquid)
        working-directory: formal/liquid
        run: stack build --system-ghc --no-install-ghc
