# models.toml — backend configuration for audit-eval runner
# Edit this file to configure which models to use.

[codex]
# Codex CLI backend (subprocess). Uses the `codex` CLI installed locally.
# `codex` must be on PATH and logged in (`codex login` done).
# Runs in an isolated empty workdir (--cd) with a read-only sandbox so the
# agentic CLI cannot read the EA repo / SKILL files nor write anywhere —
# prompt-only arm comparisons stay uncontaminated.
backend = "codex"
timeout_seconds = 1200  # Track S: large-N direct-answer arms enumerate long JSON; 480s timed out on mixed N=10 (56 derived keys). Raised arm-neutrally; a timeout is now recorded as non-convergence and NOT retried (see runner/models.py BackendTimeout).
# model passed via -c model=... to codex CLI (optional, uses codex default if omitted)
# model = "o4-mini"

[local]
# OpenAI-compatible HTTP backend (Ollama / vLLM / LM Studio / llama.cpp).
# Point base_url at your local server; api_key can be "ollama" or any placeholder.
# 2026-07-03: Qwen3 30B-A3B (MoE, ~18GB q4) via Ollama 0.31.1 on M3 Max 36GB —
# the mid-tier model of the confirmatory model axis (scale-redesign §2.7).
backend = "openai_compat"
base_url = "http://localhost:11434"
model = "qwen3:30b-a3b"
api_key = "ollama"
timeout_seconds = 3600  # 2026-08-04: raised 1200 -> 3600 arm-neutrally. At N=200 the cap became arm-asymmetric attrition rather than a fairness device: on the mixed cluster A (2152s) and Aprime (1200s) timed out while B (713s) and C (586s) finished, so the one cell where CP1 separates had no data for the arms the claim is about. The cap must not decide which arms are measured. Timeouts are still terminal and recorded as timed_out.
