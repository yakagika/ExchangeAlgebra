name:                exchangealgebra-examples
version:             0.4.0.0
license:             MIT
author:              "Kaya Akagi"
maintainer:          "kaya3728@gmail.com"
copyright:           "2019 Kaya Akagi"

synopsis:            Example executables for the exchangealgebra library
category:            Accounting, Finance, Math
description:         |
  Example programs that demonstrate the @exchangealgebra@ library.
  Not intended for Hackage publication.

dependencies:
- base                  >= 4.17    && < 5
- exchangealgebra       == 0.5.*
- text                  >= 2.0     && < 2.2
- containers            >= 0.6     && < 0.8
- numeric-prelude       >= 0.4.4   && < 0.5
- non-negative          >= 0.1.2   && < 0.2
- array                 >= 0.5.5   && < 0.6
- random                >= 1.2     && < 1.3
- mtl                   >= 2.3     && < 2.4
- parallel              >= 3.2     && < 3.3
- vector                >= 0.13    && < 0.14
- async                 >= 2.2     && < 2.3
- statistics            >= 0.16    && < 0.17
- hashable              >= 1.4     && < 1.6
- unordered-containers  >= 0.2.19  && < 0.3
- process               >= 1.6     && < 1.7
- directory             >= 1.3     && < 1.4
- bytestring            >= 0.11    && < 0.13
- binary                >= 0.8     && < 0.9
- time                  >= 1.12    && < 1.15
- deepseq               >= 1.4     && < 1.6

_exe-defs: &exe-defaults
  ghc-options: [-O2
               ,-threaded
               ,-rtsopts
               ,-with-rtsopts=-N4
               # -feager-blackholing: see library note in ../package.yaml. The
               # spark site (ParChunk over per-firm stages) lives in these exes,
               # so the flag is needed here too, to avoid spurious <<loop>>
               # under multi-capability runs (e.g. EA_PAR=par:16 +RTS -N4).
               ,-feager-blackholing
               ,-fwrite-ide-info]
  # -no_warn_duplicate_libraries is a macOS (ld64) flag; GNU ld rejects it.
  # Inherited by every exe via '<<: *exe-defaults' (merges the 'when' key too).
  when:
  - condition: os(darwin)
    ghc-options: ['-optl-Wl,-no_warn_duplicate_libraries']

executables:
  ebex1:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx1.hs
    source-dirs:         basic

  ebex2:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx2.hs
    source-dirs:         basic

  ebex3:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx3.hs
    source-dirs:         basic

  ebex4:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx4.hs
    source-dirs:         basic

  ebex5:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx5.hs
    source-dirs:         basic

  ebex6:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx6.hs
    source-dirs:         basic

  ebex7:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx7.hs
    source-dirs:         basic

  ebex8:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx8.hs
    source-dirs:         basic

  ebex9:
    <<: *exe-defaults
    main:                elementaryBookkeepingEx9.hs
    source-dirs:         basic

  sim1:
    <<: *exe-defaults
    main:                simulateEx1.hs
    source-dirs:         basic

  sim2:
    <<: *exe-defaults
    main:                simulateEx2.hs
    source-dirs:         basic

  # MoneyDouble (fast FP) twin of sim2, used as the performance-roadmap baseline.
  sim2fast:
    <<: *exe-defaults
    main:                simulateEx2Fast.hs
    source-dirs:         basic

  rippleWithStock:
    <<: *exe-defaults
    main:                rippleWithStock.hs
    source-dirs:         deterministic/ripple

  rippleWithStockMultiSeeds:
    <<: *exe-defaults
    main:                rippleWithStockMultiSeeds.hs
    source-dirs:         deterministic/ripple
    # overrides the anchor's ghc-options (-N10); the macOS-only flag comes from
    # the inherited 'when: os(darwin)' in *exe-defaults.
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N10
    - -feager-blackholing

  ripple:
    <<: *exe-defaults
    main:                ripple.hs
    source-dirs:         deterministic/ripple

  cge:
    <<: *exe-defaults
    main:                stdcge.hs
    source-dirs:         optimization/CGE

  # Phase 1 (general-equilibrium:phase1-cge-reproduction) — the Simulate.Lite
  # rebuild of the Hosoe Ch.6 CGE toy (task 1a calibration + R2 solver core
  # + task 1b stages). CGELite.hs is the thin Main; Model is the model proper
  # (stages, oracle, solve wiring); Calibration is the GAMS-mirroring
  # SAM/parameter port; Solver is the generic damped Newton/Broyden root
  # finder. 'other-modules' is explicit so the test mains under
  # optimization/cge-lite/test are not auto-scooped into this exe.
  cge-lite:
    <<: *exe-defaults
    main:                CGELite.hs
    source-dirs:         optimization/cge-lite
    other-modules:
    - Calibration
    - Model
    - Solver

  # Phase 5 (feat/market-scale-experiments): the market-scale experiment. The
  # value-type-polymorphic model lives in MarketModel; marketEx1 (MoneyDouble)
  # and marketEx1d (MoneyDecimal) are thin twin mains that differ only in v.
  # Heavy stages (trade 6-entry posting / production / report 1-pass), env
  # parameters (EA_N/EA_T/EA_K/EA_NET/EA_PAR/EA_RETAIN/EA_SPILL/EA_SEED/EA_TARGET),
  # inventory-connected demand. 'other-modules' is set explicitly so the two
  # Main twins do not collide via stack's source-dir auto-discovery.
  marketEx1:
    <<: *exe-defaults
    main:                marketEx1.hs
    source-dirs:         market
    other-modules:       MarketModel

  marketEx1d:
    <<: *exe-defaults
    main:                marketEx1d.hs
    source-dirs:         market
    other-modules:       MarketModel

tests:
  # Task-1a calibration sentinel (general-equilibrium:phase1-cge-reproduction):
  # the Calibration port must match the GAMS ground truth (stdcge.lst display
  # values, results.csv benchmark, SAM balance, accounting identities).
  # 'other-modules' is explicit so the sibling Mains (CGELite.hs,
  # SolverTest.hs) in the shared source dirs are not auto-scooped.
  cge-lite-test:
    main:                CalibrationTest.hs
    source-dirs:
    - optimization/cge-lite
    - optimization/cge-lite/test
    other-modules:
    - Calibration
    - TestHarness
    ghc-options:
    - -O0
    when:
    - condition: os(darwin)
      ghc-options:
      - '-optl-Wl,-no_warn_duplicate_libraries'

  # Task-1b model sentinel (general-equilibrium:phase1-cge-reproduction):
  # the stage bodies must reproduce the Hosoe Ch.6 benchmark — allocation
  # fields against Levels0, benchmark-zero residuals (incl. the dropped
  # Walras/import rows), household-count invariance, and the perturbed-start
  # convergence smoke (prices -> 1.0, UU -> 25.5085).
  cge-lite-model-test:
    main:                ModelTest.hs
    source-dirs:
    - optimization/cge-lite
    - optimization/cge-lite/test
    other-modules:
    - Calibration
    - Model
    - Solver
    - TestHarness
    ghc-options:
    - -O0
    when:
    - condition: os(darwin)
      ghc-options:
      - '-optl-Wl,-no_warn_duplicate_libraries'

  # R2 solver-core sentinel (general-equilibrium:phase1-cge-reproduction):
  # Solver (damped Newton/Broyden + line search) verified against artificial
  # excess-demand oracles with known roots, independently of the CGE stages.
  cge-lite-solver-test:
    main:                SolverTest.hs
    source-dirs:
    - optimization/cge-lite
    - optimization/cge-lite/test
    other-modules:
    - Solver
    - TestHarness
    ghc-options:
    - -O0
    when:
    - condition: os(darwin)
      ghc-options:
      - '-optl-Wl,-no_warn_duplicate_libraries'

benchmarks:
  # Performance roadmap benchmark harness (ROAD_MAP "ベンチマーク基盤の整備").
  # criterion is scoped to this component only, so the library and the example
  # executables do not gain the dependency.
  bench-core:
    main:                Bench.hs
    source-dirs:         benchmark
    dependencies:
    - criterion          >= 1.6 && < 1.7
    ghc-options:
    - -O2
    - -rtsopts
    when:
    - condition: os(darwin)
      ghc-options:
      - '-optl-Wl,-no_warn_duplicate_libraries'
