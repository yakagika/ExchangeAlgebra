name:                exchangealgebra-einvoice
version:             0.1.0.0
github:              "yakagika/ExchangeAlgebra"
license:             MIT
license-file:        LICENSE.txt
author:              "Kaya Akagi"
maintainer:          "yakagika@icloud.com"
copyright:           "2026 Kaya Akagi"

synopsis:            Read UBL e-invoices (JP PINT) into exchange algebra journals
category:            Accounting, Finance

description: >-
  Reads Japanese qualified invoices in the JP PINT profile of UBL 2.1 and turns
  each invoice into one balanced exchange algebra entry. The caller supplies the
  function that builds the base of each term, so the base may have elements
  other than the account, such as the tax rate or the counterparty.
  Tax-exclusive and tax-inclusive accounting are both supported.

extra-doc-files:
- ChangeLog.md

dependencies:
- base                  >= 4.19    && < 5
- exchangealgebra       >= 0.7     && < 0.8
- bytestring            >= 0.11    && < 0.13
- containers            >= 0.6     && < 0.8
- text                  >= 2.0     && < 2.2
- time                  >= 1.12    && < 1.15
- xml-conduit           >= 1.9.1   && < 1.11

ghc-options:
- -Wall

library:
  source-dirs: src
  exposed-modules:
  - ExchangeAlgebra.IO.Input.EInvoice
  - ExchangeAlgebra.IO.Input.EInvoice.Document
  - ExchangeAlgebra.IO.Input.EInvoice.Journal

tests:
  exchangealgebra-einvoice-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
    - exchangealgebra-einvoice
    - hashable  >= 1.4  && < 1.6
    - QuickCheck >= 2.14 && < 3
